{% extends 'base.html' %}



{% block title %}
Delete
{% endblock %}



{% block content %}


<div class="dashboard-wrapper">



<div class="chart-card">


<h2 class="page-title">
Confirm Delete
</h2>



<p>
Are you sure you want to delete:
</p>



<h3>
{{ object }}
</h3>




<form method="POST">


{% csrf_token %}



<button
type="submit"
class="delete-btn">

<i class="fa-solid fa-trash"></i>

Yes, Delete

</button>




<a
href="javascript:history.back()"
class="cancel-btn">

Cancel

</a>



</form>


</div>


</div>


{% endblock %}
