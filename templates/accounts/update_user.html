{% extends "base.html" %}

{% block title %}Update User{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Update User</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}
        <div class="btn-row">
            <button type="submit" class="btn btn-primary">
            Update
        </button>

        <a href="{% url 'accounts:user_list' %}" class="btn btn-secondary">
            Cancel
        </a>
        </div>

    </form>

</div>

{% endblock %}
